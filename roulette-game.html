<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>🎡 ROYAL ROULETTE</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ROULETTE">
<meta name="theme-color" content="#0a0508">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Bungee&family=Bungee+Shade&family=Black+Han+Sans&family=Jua&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--gold:#FFD700;--gold2:#FFA500;--gold-dark:#8B6914;--gold-deep:#5C4A0F;
--red:#E60012;--red-deep:#8B0000;--red-dark:#4A0000;
--cream:#FFF8DC;--ivory:#FFFAF0;
--neon-pink:#FF10F0;--neon-cyan:#00FFFF;--neon-green:#39FF14;--neon-purple:#BF00FF;
--gf:#0d4d0d;--gfd:#062006;--gfl:#1a6b1a;
--pixel:'Press Start 2P','Courier New',monospace;
--retro:'VT323','Courier New',monospace;
--display:'Bungee',Impact,sans-serif;
--ds:'Bungee Shade',Impact,sans-serif;
--kb:'Black Han Sans','Jua','Malgun Gothic',sans-serif;
--kr:'Jua','Malgun Gothic','맑은 고딕',sans-serif;
}
html,body{height:100%;height:100dvh;overflow:hidden;-webkit-text-size-adjust:100%;background:#000}
body{font-family:var(--kr);color:var(--cream);display:flex;justify-content:center;background:radial-gradient(ellipse at center,#1a0511 0%,#000 100%);overscroll-behavior:none}
#app{
width:100%;max-width:480px;height:100vh;height:100dvh;
position:relative;overflow:hidden;display:flex;flex-direction:column;
background:radial-gradient(ellipse at top,#2a0820 0%,transparent 50%),radial-gradient(ellipse at bottom,#3d1a0a 0%,transparent 60%),linear-gradient(180deg,#0d0205 0%,#1a0511 50%,#0d0205 100%);
}
#app::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:0;opacity:.05;background-image:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(255,255,255,.5) 2px,rgba(255,255,255,.5) 3px),repeating-linear-gradient(90deg,transparent,transparent 2px,rgba(255,255,255,.3) 2px,rgba(255,255,255,.3) 3px);mix-blend-mode:overlay}

/* MARQUEE */
.mq{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:100vh;height:100dvh;pointer-events:none;z-index:1}
.bulb{position:absolute;width:5px;height:5px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,var(--gold) 40%,var(--gold-dark) 90%);box-shadow:0 0 3px var(--gold);transition:opacity .12s}
.bulb.off{background:radial-gradient(circle at 30% 30%,#3d2807,#1a0f00);box-shadow:none}

/* TOP BAR */
.topbar{flex-shrink:0;display:flex;align-items:center;gap:6px;padding:8px 10px 6px;padding-top:max(8px,env(safe-area-inset-top,8px));position:relative;z-index:5}
.back-btn{background:rgba(0,0,0,.4);border:2px solid var(--gold-dark);color:var(--gold);font-family:var(--pixel);font-size:7px;padding:6px 10px;border-radius:6px;cursor:pointer;text-decoration:none;flex-shrink:0;-webkit-tap-highlight-color:transparent}
.back-btn:active{background:rgba(255,215,0,.1)}
.tab-bar{display:flex;gap:4px;flex:1}
.tab-btn{flex:1;padding:6px 2px;border:2px solid var(--gold-dark);border-radius:6px;background:rgba(0,0,0,.4);color:var(--gold);font-family:var(--pixel);font-size:6px;letter-spacing:.8px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tab-btn.active{background:linear-gradient(180deg,var(--gold),var(--gold-dark));color:var(--red-deep);border-color:var(--gold)}

/* SCREENS */
.screen{display:none;flex-direction:column;flex:1;overflow:hidden;position:relative;z-index:3}
.screen.active{display:flex}
.screen.scr{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 10px 20px}

/* GAME SCREEN */
#scGame{padding:0 8px 4px}

/* STATUS BAR */
.sb{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:6px;background:linear-gradient(180deg,#0a0a0a,#1a0a0a,#0a0a0a);border:2px solid var(--gold-deep);border-radius:8px;padding:5px;box-shadow:inset 0 0 10px rgba(0,0,0,.9);flex-shrink:0}
.sc{background:#000;border:1px solid var(--gold-dark);border-radius:4px;padding:3px 4px;text-align:center}
.sl{font-family:var(--pixel);font-size:5px;letter-spacing:.5px;color:var(--neon-cyan);opacity:.8}
.sv{font-family:var(--retro);font-size:16px;font-weight:700;color:var(--gold);text-shadow:0 0 5px var(--gold);line-height:1;margin-top:1px}
.sv.g{color:var(--neon-green);text-shadow:0 0 5px var(--neon-green)}
.sv.p{color:var(--neon-pink);text-shadow:0 0 5px var(--neon-pink)}
.sv.r{color:var(--red);text-shadow:0 0 5px var(--red);animation:rB .3s infinite alternate}
@keyframes rB{0%{filter:brightness(1)}100%{filter:brightness(1.5)}}

/* WHEEL + BETTING */
.game-layout{display:flex;gap:8px;flex:1;min-height:0;margin-bottom:6px}

.wheel-col{flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;width:185px}
.wc{position:relative;width:178px;height:178px}
.wf{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,#2a1a0a 60%,transparent 65%),conic-gradient(from 0deg,#FFD700 0deg,#FFA500 30deg,#8B6914 60deg,#FFD700 90deg,#FFA500 120deg,#8B6914 150deg,#FFD700 180deg,#FFA500 210deg,#8B6914 240deg,#FFD700 270deg,#FFA500 300deg,#8B6914 330deg,#FFD700 360deg);box-shadow:inset 0 0 20px rgba(0,0,0,.6),0 0 18px rgba(255,215,0,.3),0 4px 14px rgba(0,0,0,.7)}
.ws{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:152px;height:152px;border-radius:50%;box-shadow:inset 0 0 14px rgba(0,0,0,.7);transition:transform 4s cubic-bezier(.17,.67,.31,1)}
.wp{position:absolute;top:-5px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-top:15px solid var(--gold);filter:drop-shadow(0 2px 3px rgba(0,0,0,.7)) drop-shadow(0 0 4px var(--gold));z-index:10}
.wb{position:absolute;left:50%;top:50%;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff 0%,#eee 40%,#aaa 100%);box-shadow:inset -1px -1px 2px rgba(0,0,0,.3),0 1px 3px rgba(0,0,0,.5);transform-origin:0 0;z-index:7;margin-left:-4.5px;margin-top:-4.5px;transition:transform 4s cubic-bezier(.17,.67,.31,1)}
.wh{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#FFD700 0%,#FFA500 40%,#8B6914 100%);box-shadow:inset 0 -2px 4px rgba(0,0,0,.3),inset 0 2px 4px rgba(255,255,255,.4),0 1px 4px rgba(0,0,0,.5);border:2px solid var(--gold-deep);display:flex;align-items:center;justify-content:center;z-index:6;font-size:17px}

.wr{display:flex;align-items:center;gap:5px;margin-top:5px;font-family:var(--pixel);font-size:6px;letter-spacing:1px;color:var(--gold)}
.rc{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;font-family:var(--display);font-size:15px;border:2px solid var(--gold);animation:nP .5s ease-out}
@keyframes nP{from{transform:scale(0) rotate(-180deg);opacity:0}to{transform:scale(1);opacity:1}}
.rr{background:var(--red);color:#fff}.rb{background:#111;color:#fff}.rg{background:var(--gf);color:#fff}
.rgd{background:radial-gradient(circle,#FFD700,#FFA500);color:#000;border-color:var(--neon-pink);box-shadow:0 0 8px var(--gold),0 0 15px var(--neon-pink);animation:gg 1s ease-in-out infinite alternate}
@keyframes gg{0%{box-shadow:0 0 8px var(--gold),0 0 15px var(--neon-pink)}100%{box-shadow:0 0 18px var(--gold),0 0 30px var(--neon-pink)}}

/* BET COL */
.bet-col{flex:1;display:flex;flex-direction:column;min-height:0}
.tw{background:linear-gradient(180deg,var(--gf) 0%,var(--gfd) 100%);border:2px solid var(--gold);border-radius:8px;padding:5px;flex:1;box-shadow:inset 0 0 20px rgba(0,0,0,.5),0 3px 8px rgba(0,0,0,.5);position:relative;overflow:hidden;display:flex;flex-direction:column;gap:4px}
.tw::before{content:'';position:absolute;inset:0;border-radius:6px;pointer-events:none;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.04) 0%,transparent 50%)}
.tl{font-family:var(--pixel);font-size:5px;letter-spacing:1px;color:var(--gold);opacity:.8;text-align:center}

/* Numbers grid */
.ng{display:grid;grid-template-columns:22px repeat(12,1fr);gap:1.5px;position:relative;z-index:1}
.nz{display:flex;flex-direction:column;gap:1.5px;grid-row:span 3}
.nc{display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,215,0,.3);border-radius:2px;font-family:var(--display);font-size:8px;color:#fff;cursor:pointer;-webkit-tap-highlight-color:transparent;position:relative;transition:filter .1s;aspect-ratio:1}
.nc:active{filter:brightness(1.5)}
.nc.red{background:linear-gradient(135deg,#E60012,#B00010)}.nc.black{background:linear-gradient(135deg,#1a1a1a,#000)}.nc.green{background:linear-gradient(135deg,#1a6b1a,#0d4d0d)}
.nc.hb,.ob.hb{box-shadow:inset 0 0 0 2px var(--neon-cyan)!important}
.chip-d{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 30% 30%,var(--neon-cyan),#0a8aab);border:1px dashed #fff;font-family:var(--pixel);font-size:5px;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(0,0,0,.6);z-index:2}

/* Outside bets 3 cols */
.obg{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5px;position:relative;z-index:1}
.ob{padding:5px 2px;border:1px solid rgba(255,215,0,.3);border-radius:3px;font-family:var(--kb);font-size:9px;color:#fff;cursor:pointer;-webkit-tap-highlight-color:transparent;position:relative;transition:filter .1s;text-align:center}
.ob:active{filter:brightness(1.4)}
.ob.red{background:linear-gradient(135deg,#E60012,#B00010)}.ob.black{background:linear-gradient(135deg,#1a1a1a,#000)}.ob.green{background:linear-gradient(135deg,#1a6b1a,#0d4d0d);font-size:8px}
.ox{font-family:var(--pixel);font-size:5px;color:var(--gold);display:block;margin-top:1px;opacity:.85}

/* CHIP ROW */
.cr{display:flex;justify-content:center;align-items:center;gap:5px;padding:4px 8px;background:rgba(0,0,0,.3);border-radius:8px;border:1.5px solid var(--gold-dark);flex-shrink:0;margin-bottom:5px}
.cb{position:relative;width:38px;height:38px;border-radius:50%;border:none;cursor:pointer;font-family:var(--display);font-size:8px;color:#fff;-webkit-tap-highlight-color:transparent;text-shadow:1px 1px 0 rgba(0,0,0,.6);transition:all .12s;font-weight:bold}
.cb::before{content:'';position:absolute;inset:3px;border-radius:50%;border:2px dashed rgba(255,255,255,.4)}
.cb.active{transform:scale(1.15);box-shadow:0 0 0 2.5px var(--gold),0 0 10px var(--neon-cyan)}
.cb:active{transform:scale(.93)}
.c100{background:radial-gradient(circle at 30% 30%,#fff,#ddd 50%,#aaa 100%);color:#000;text-shadow:none}
.c500{background:radial-gradient(circle at 30% 30%,#FF6B6B,#E60012 50%,#8B0000 100%)}
.c1k{background:radial-gradient(circle at 30% 30%,#5BC0EB,#1976D2 50%,#0D47A1 100%)}
.c5k{background:radial-gradient(circle at 30% 30%,#9D4EDD,#7B2CBF 50%,#3C096C 100%)}
.c10k{background:radial-gradient(circle at 30% 30%,#1a1a1a,#000 50%,#000 100%);border:1.5px solid var(--gold)}

/* ACTIONS */
.ar{display:flex;gap:6px;flex-shrink:0;margin-bottom:4px;position:relative}
.spb{flex:3;padding:0;border:none;border-radius:10px;background:linear-gradient(180deg,#FFD700 0%,#FFA500 50%,#8B6914 100%);cursor:pointer;box-shadow:inset 0 2px 0 rgba(255,255,255,.5),inset 0 -2px 0 var(--gold-deep),0 3px 0 var(--gold-deep),0 5px 10px rgba(0,0,0,.5);transition:all .1s;-webkit-tap-highlight-color:transparent;position:relative;overflow:hidden}
.spi{display:block;padding:11px 10px;font-family:var(--display);font-size:16px;letter-spacing:1.5px;color:var(--red-deep);text-shadow:1px 1px 0 rgba(255,215,0,.6);border:2px solid var(--red-deep);border-radius:7px;margin:3px}
.spb:disabled{opacity:.5;cursor:not-allowed}
.spb:not(:disabled):active{transform:translateY(2px);box-shadow:inset 0 2px 0 rgba(255,255,255,.5),inset 0 -2px 0 var(--gold-deep),0 1px 0 var(--gold-deep)}
.spb.spinning{animation:spP .4s infinite alternate}
@keyframes spP{0%{box-shadow:inset 0 2px 0 rgba(255,255,255,.5),inset 0 -2px 0 var(--gold-deep),0 3px 0 var(--gold-deep),0 0 12px var(--gold)}100%{box-shadow:inset 0 2px 0 rgba(255,255,255,.5),inset 0 -2px 0 var(--gold-deep),0 3px 0 var(--gold-deep),0 0 28px var(--gold),0 0 45px var(--neon-pink)}}
.clb{flex:1;padding:0;border:none;border-radius:10px;background:linear-gradient(180deg,#555,#333);cursor:pointer;box-shadow:inset 0 2px 0 rgba(255,255,255,.15),0 3px 0 #1a1a1a;-webkit-tap-highlight-color:transparent}
.cli{display:block;padding:11px 4px;font-family:var(--pixel);font-size:7px;letter-spacing:.8px;color:var(--gold);border:1.5px solid var(--gold-dark);border-radius:7px;margin:3px;text-align:center}
.clb:active{transform:translateY(2px)}
.fsb{position:absolute;top:-8px;right:0;background:linear-gradient(135deg,var(--neon-pink),var(--neon-purple));color:#fff;font-family:var(--pixel);font-size:6px;padding:3px 6px;border-radius:50px;box-shadow:0 0 6px var(--neon-pink);border:1px solid #fff;animation:fsbB .8s ease-in-out infinite alternate;z-index:5;letter-spacing:1px}
@keyframes fsbB{0%{transform:translateY(0) rotate(-5deg)}100%{transform:translateY(-2px) rotate(5deg)}}

/* RESULT TOAST */
.rt{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(120px);width:92%;max-width:440px;background:linear-gradient(135deg,#2a0820 0%,#1a0511 100%);border:2px solid var(--gold);border-radius:12px;padding:10px 14px;text-align:center;z-index:100;transition:transform .4s cubic-bezier(.2,.8,.3,1),opacity .4s;opacity:0;pointer-events:none;box-shadow:0 -3px 16px rgba(255,215,0,.2),0 3px 16px rgba(0,0,0,.6)}
.rt.show{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:auto}
.rth{font-family:var(--ds);font-size:22px;letter-spacing:2px;line-height:1}
.rth.win{background:linear-gradient(180deg,#FFD700,#FFA500,#FF0000);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 0 8px var(--gold))}
.rth.lose{color:#666}
.rth.jackpot{background:linear-gradient(180deg,#fff,#FFD700,#FF10F0,#FF0000);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 0 12px var(--gold));animation:jpS .15s infinite}
@keyframes jpS{0%{transform:translateX(-2px)}50%{transform:translateX(2px)}100%{transform:translateX(-1px)}}
.rtd{font-family:var(--kr);font-size:11px;color:rgba(255,248,220,.6);margin-top:2px}
.rta{font-family:var(--display);font-size:18px;color:var(--gold);text-shadow:0 0 7px var(--gold);margin-top:3px}
.rta.lose{color:#888;text-shadow:none}
.rtw{font-family:var(--kr);font-size:10px;color:var(--neon-cyan);margin-top:2px}
.rtx{position:absolute;top:6px;right:10px;font-size:15px;color:rgba(255,248,220,.35);cursor:pointer;background:none;border:none;padding:0}

/* BONUS POPUP */
.bp{position:fixed;top:25%;left:50%;transform:translateX(-50%) scale(0);background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--red-deep);font-family:var(--display);font-size:16px;padding:12px 24px;border-radius:12px;border:3px solid var(--red);box-shadow:0 0 20px var(--gold),0 0 40px var(--neon-pink);text-shadow:1px 1px 0 #fff;letter-spacing:2px;text-align:center;z-index:200;pointer-events:none;animation:bpP 2.5s forwards}
.bp .bps{display:block;font-family:var(--kb);font-size:11px;color:var(--red-deep);margin-top:3px;letter-spacing:0;text-shadow:1px 1px 0 #fff}
@keyframes bpP{0%{transform:translateX(-50%) scale(0) rotate(-10deg);opacity:0}15%{transform:translateX(-50%) scale(1.15) rotate(3deg);opacity:1}25%{transform:translateX(-50%) scale(1) rotate(-1deg)}80%{transform:translateX(-50%) scale(1);opacity:1}100%{transform:translateX(-50%) scale(.8);opacity:0}}

/* RECORDS / HISTORY */
.rh{text-align:center;padding:12px 0 8px;font-family:var(--ds);font-size:18px;letter-spacing:2px;color:var(--gold);text-shadow:2px 2px 0 var(--red-dark),0 0 10px rgba(255,215,0,.4)}
.recc{background:linear-gradient(135deg,#2a0820 0%,#1a0511 100%);border:2px solid var(--gold);border-radius:10px;padding:10px;margin-bottom:8px;position:relative;overflow:hidden}
.recc::before{content:'';position:absolute;top:-15px;right:-15px;width:60px;height:60px;border-radius:50%;background:repeating-conic-gradient(var(--red) 0 30deg,var(--cream) 30deg 60deg);opacity:.06;z-index:0}
.rect{font-family:var(--display);font-size:10px;letter-spacing:1.5px;color:var(--gold);margin-bottom:5px;position:relative;z-index:1}
.recv{font-family:var(--display);font-size:26px;background:linear-gradient(180deg,#FFD700,#FF8C00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 0 5px rgba(255,215,0,.4));text-align:center;line-height:1;position:relative;z-index:1}
.recs{font-family:var(--kr);font-size:10px;color:rgba(255,248,220,.4);text-align:center;margin-top:3px;position:relative;z-index:1}
.recg{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:8px}
.recg .recc{margin-bottom:0;padding:8px}.recg .recv{font-size:20px}.recg .rect{font-size:9px}
.sh{font-family:var(--pixel);font-size:7px;letter-spacing:2px;color:var(--gold);text-shadow:0 0 4px var(--gold);margin:12px 0 6px;text-align:center}
.ht{background:linear-gradient(135deg,#2a0820 0%,#1a0511 100%);border:2px solid var(--gold-dark);border-radius:8px;overflow:hidden;margin-top:6px}
.hr{display:grid;grid-template-columns:28px 1fr auto;gap:7px;padding:7px 9px;align-items:center;border-bottom:1px solid rgba(255,215,0,.07)}
.hr:last-child{border-bottom:none}
.hr.win{background:rgba(57,255,20,.04)}.hr.lose{background:rgba(230,0,18,.04)}
.hn{display:flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-family:var(--display);font-size:11px;color:#fff;border:1.5px solid var(--gold)}
.hn.red{background:var(--red)}.hn.black{background:#000}.hn.green{background:var(--gf)}.hn.gold{background:radial-gradient(circle,var(--gold),var(--gold2));color:#000}
.hd{font-family:var(--kr);font-size:10px;color:var(--ivory)}
.ha{font-family:var(--retro);font-size:14px;font-weight:700}
.ha.win{color:var(--neon-green);text-shadow:0 0 3px var(--neon-green)}.ha.lose{color:#999}
.est{text-align:center;padding:24px 14px;font-family:var(--kr);color:rgba(255,248,220,.35);font-size:11px}

/* EFFECTS */
.confetti{position:fixed;z-index:200;pointer-events:none;animation:cf linear forwards}
@keyframes cf{0%{transform:translateY(-10vh) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
.spark{position:fixed;z-index:198;pointer-events:none;width:4px;height:4px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold),0 0 16px var(--gold);animation:spF 1.2s ease-out forwards}
@keyframes spF{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.coin-fx{position:fixed;z-index:199;pointer-events:none;font-size:22px;animation:cn linear forwards}
@keyframes cn{0%{transform:translateY(-10vh) rotateY(0) scale(.5);opacity:0}10%{opacity:1;transform:translateY(0) rotateY(180deg) scale(1.2)}100%{transform:translateY(110vh) rotateY(1440deg) scale(1);opacity:0}}
.flash-ov{position:fixed;inset:0;background:#fff;z-index:300;pointer-events:none;opacity:0;animation:flF .4s ease-out}
@keyframes flF{0%{opacity:0}10%{opacity:.95}100%{opacity:0}}
</style>
</head>
<body>
<div id="app">
<div class="mq" id="marquee"></div>

<div class="topbar">
<a href="index.html" class="back-btn">◀</a>
<div class="tab-bar">
<button class="tab-btn active" onclick="showTab('game',this)">🎡 PLAY</button>
<button class="tab-btn" onclick="showTab('records',this)">🏆 기록</button>
<button class="tab-btn" onclick="showTab('history',this)">📜 히스토리</button>
</div>
</div>

<!-- GAME -->

<script>
const AC=window.AudioContext||window.webkitAudioContext;
let ax;
function ea(){if(!ax)ax=new AC();if(ax.state==='suspended')ax.resume()}
function snd(t,f,d,v=0.07){ea();const o=ax.createOscillator(),g=ax.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,ax.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ax.currentTime+d);o.connect(g);g.connect(ax.destination);o.start();o.stop(ax.currentTime+d)}
function sfxClick(){snd('square',800,0.04,0.05)}
function sfxChip(){ea();[2200,1500].forEach((f,i)=>{const t=ax.currentTime+i*0.03;const o=ax.createOscillator(),g=ax.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0.05,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.06);o.connect(g);g.connect(ax.destination);o.start(t);o.stop(t+0.06)})}
function sfxSpin(){ea();const o=ax.createOscillator(),g=ax.createGain();o.type='sawtooth';o.frequency.setValueAtTime(150,ax.currentTime);o.frequency.linearRampToValueAtTime(60,ax.currentTime+3.5);g.gain.setValueAtTime(0.05,ax.currentTime);g.gain.linearRampToValueAtTime(0.04,ax.currentTime+3);g.gain.linearRampToValueAtTime(0,ax.currentTime+3.8);o.connect(g);g.connect(ax.destination);o.start();o.stop(ax.currentTime+3.8)}
function sfxTick(){ea();const o=ax.createOscillator(),g=ax.createGain();o.type='triangle';o.frequency.value=2000+Math.random()*1500;g.gain.setValueAtTime(0.04,ax.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ax.currentTime+0.04);o.connect(g);g.connect(ax.destination);o.start();o.stop(ax.currentTime+0.04)}
function sfxWin(){ea();[523,659,784,1047].forEach((f,i)=>{const t=ax.currentTime+i*0.1;const o=ax.createOscillator(),g=ax.createGain();o.type='square';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.08,t+0.02);g.gain.exponentialRampToValueAtTime(0.001,t+0.22);o.connect(g);g.connect(ax.destination);o.start(t);o.stop(t+0.22)})}
function sfxJP(){ea();const ml=[{f:523,d:.12},{f:659,d:.12},{f:784,d:.12},{f:1047,d:.25},{f:784,d:.12},{f:1047,d:.4}];let t=ax.currentTime;ml.forEach(n=>{const o=ax.createOscillator(),g=ax.createGain();o.type='square';o.frequency.value=n.f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.1,t+0.02);g.gain.exponentialRampToValueAtTime(0.001,t+n.d);o.connect(g);g.connect(ax.destination);o.start(t);o.stop(t+n.d);const o2=ax.createOscillator(),g2=ax.createGain();o2.type='triangle';o2.frequency.value=n.f*1.5;g2.gain.setValueAtTime(0,t);g2.gain.linearRampToValueAtTime(0.05,t+0.02);g2.gain.exponentialRampToValueAtTime(0.001,t+n.d);o2.connect(g2);g2.connect(ax.destination);o2.start(t);o2.stop(t+n.d);t+=n.d})}
function sfxLose(){ea();[330,247,196].forEach((f,i)=>{const t=ax.currentTime+i*0.1;const o=ax.createOscillator(),g=ax.createGain();o.type='sawtooth';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.06,t+0.02);g.gain.exponentialRampToValueAtTime(0.001,t+0.25);o.connect(g);g.connect(ax.destination);o.start(t);o.stop(t+0.25)})}
function sfxBonus(){ea();[800,1000,1200,1400].forEach((f,i)=>{const t=ax.currentTime+i*0.06;const o=ax.createOscillator(),g=ax.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(0.07,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.15);o.connect(g);g.connect(ax.destination);o.start(t);o.stop(t+0.15)})}

// MARQUEE
(function(){const m=document.getElementById('marquee');function build(){m.innerHTML='';const W=Math.min(480,window.innerWidth),H=window.innerHeight,sp=20,pts=[];for(let x=10;x<W-10;x+=sp)pts.push([x,4]);for(let y=10;y<H-10;y+=sp)pts.push([W-6,y]);for(let x=W-10;x>10;x-=sp)pts.push([x,H-8]);for(let y=H-10;y>10;y-=sp)pts.push([4,y]);pts.forEach(p=>{const d=document.createElement('div');d.className='bulb';d.style.left=p[0]+'px';d.style.top=p[1]+'px';m.appendChild(d)})}build();window.addEventListener('resize',build);let fr=0;setInterval(()=>{m.querySelectorAll('.bulb').forEach((d,i)=>d.classList.toggle('off',(i+fr)%3!==0));fr++},170)})();

// ROULETTE DATA
const WO=[0,28,9,26,30,11,7,20,32,17,5,22,34,15,3,24,36,13,1,'00',27,10,25,29,12,8,19,31,18,6,21,33,16,4,23,35,14,2];
const RN=[1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];
function gc(n){if(n===0||n==='00')return 'green';return RN.includes(n)?'red':'black'}

// BUILD WHEEL SVG
function buildWhl(){
const svg=document.getElementById('wSvg');
const cx=76,cy=76,R=76,r=18;
const sl=WO.length,ag=360/sl;
let h=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="#1a1a1a"/>`;
WO.forEach((num,i)=>{
const sA=i*ag-90-ag/2,eA=sA+ag;
const sa=sA*Math.PI/180,ea=eA*Math.PI/180;
const x1=cx+R*Math.cos(sa),y1=cy+R*Math.sin(sa),x2=cx+R*Math.cos(ea),y2=cy+R*Math.sin(ea);
const x3=cx+r*Math.cos(ea),y3=cy+r*Math.sin(ea),x4=cx+r*Math.cos(sa),y4=cy+r*Math.sin(sa);
const col=gc(num);const fill=col==='red'?'#E60012':col==='green'?'#0d4d0d':'#0a0a0a';
h+=`<path d="M${x1},${y1} A${R},${R} 0 0,1 ${x2},${y2} L${x3},${y3} A${r},${r} 0 0,0 ${x4},${y4} Z" fill="${fill}" stroke="#FFD700" stroke-width=".5"/>`;
const ta=(sA+ag/2)*Math.PI/180,tr=R*0.74,tx=cx+tr*Math.cos(ta),ty=cy+tr*Math.sin(ta);
h+=`<text x="${tx}" y="${ty}" text-anchor="middle" dominant-baseline="middle" fill="#fff" font-family="Impact,sans-serif" font-size="6.5" font-weight="900" transform="rotate(${sA+ag/2+90} ${tx} ${ty})">${num}</text>`;
});
svg.innerHTML=h;
}
buildWhl();

// STATE
let chips=100000,bets={},selChip=100,streak=0,spinning=false,totalSpins=0,freeSpins=0;
let savedBets={},curAngle=0,toastTmr=null;
let hist=ld('rl_h',[]),rec=ld('rl_r',{maxChips:100000,biggestWin:0,totalSpins:0,maxStreak:0});
function ld(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function fmt(n){return n.toLocaleString()}

// GRID
function buildGrid(){
const g=document.getElementById('numGrid');
let h=`<div class="nz" style="grid-row:span 3">
<div class="nc green" data-num="0" style="flex:1;display:flex;align-items:center;justify-content:center;height:100%">0</div>
<div class="nc green" data-num="00" style="flex:1;display:flex;align-items:center;justify-content:center;height:100%">00</div>
</div>`;
for(let c=0;c<12;c++){const n=3+c*3;h+=`<div class="nc ${gc(n)}" data-num="${n}">${n}</div>`}
for(let c=0;c<12;c++){const n=2+c*3;h+=`<div class="nc ${gc(n)}" data-num="${n}">${n}</div>`}
for(let c=0;c<12;c++){const n=1+c*3;h+=`<div class="nc ${gc(n)}" data-num="${n}">${n}</div>`}
g.innerHTML=h;
g.querySelectorAll('.nc').forEach(e=>e.addEventListener('click',()=>placeBet('n_'+e.dataset.num)));
document.querySelectorAll('.ob').forEach(e=>e.addEventListener('click',()=>placeBet(e.dataset.bet)));
}
buildGrid();

// CHIPS
document.querySelectorAll('.cb').forEach(b=>{
b.addEventListener('click',()=>{sfxClick();document.querySelectorAll('.cb').forEach(x=>x.classList.remove('active'));b.classList.add('active');selChip=parseInt(b.dataset.chip)});
});

// BETTING
function placeBet(k){if(spinning)return;if(chips<selChip){flashC();return}sfxChip();chips-=selChip;bets[k]=(bets[k]||0)+selChip;updUI();updBV()}
function clearBets(){if(spinning)return;sfxClick();chips+=Object.values(bets).reduce((a,b)=>a+b,0);bets={};updUI();updBV()}
function flashC(){const v=document.getElementById('vC');v.className='sv r';setTimeout(()=>v.className='sv',800)}
function updBV(){
document.querySelectorAll('.chip-d').forEach(c=>c.remove());
document.querySelectorAll('.hb').forEach(e=>e.classList.remove('hb'));
Object.entries(bets).forEach(([k,a])=>{
let cell=k.startsWith('n_')?document.querySelector(`[data-num="${k.substring(2)}"]`):document.querySelector(`[data-bet="${k}"]`);
if(cell){cell.classList.add('hb');const c=document.createElement('div');c.className='chip-d';c.textContent=a>=1000?(a/1000).toFixed(a%1000?1:0)+'K':a;cell.appendChild(c)}
});
}
function updUI(){
document.getElementById('vC').textContent=fmt(chips);
document.getElementById('vB').textContent=fmt(Object.values(bets).reduce((a,b)=>a+b,0));
document.getElementById('vS').textContent=streak;
document.getElementById('vSp').textContent=totalSpins;
document.getElementById('fsb').style.display=freeSpins>0?'block':'none';
if(freeSpins>0)document.getElementById('fsb').textContent=`FREE×${freeSpins}`;
if(chips>rec.maxChips){rec.maxChips=chips;sv('rl_r',rec)}
}

// SPIN
function spinWheel(){
if(spinning)return;
const tb=Object.values(bets).reduce((a,b)=>a+b,0);
const isFS=freeSpins>0&&tb===0;
if(tb===0&&!isFS){showBP('베팅 먼저!','칩을 올려두세요');return}
spinning=true;totalSpins++;
savedBets={...bets};
const btn=document.getElementById('spinBtn');
btn.disabled=true;btn.classList.add('spinning');
closeToast();
document.getElementById('wRes').style.visibility='hidden';
if(isFS){freeSpins--;showBP('FREE SPIN!','무료 회전권 사용')}
ea();sfxSpin();
const ri=Math.floor(Math.random()*WO.length);
const ln=WO[ri];
const aps=360/WO.length;
const tA=-ri*aps;
const rots=5+Math.floor(Math.random()*3);
const fA=curAngle-360*rots+(tA-(curAngle%360));
curAngle=fA;
const svg=document.getElementById('wSvg');
svg.style.transition='transform 4s cubic-bezier(.17,.67,.31,1)';
svg.style.transform=`translate(-50%,-50%) rotate(${curAngle}deg)`;
const ball=document.getElementById('wBall');
ball.style.transition='transform 4s cubic-bezier(.17,.67,.31,1)';
ball.style.transform=`rotate(${360*8}deg) translate(0,-63px)`;
let tc=0;const ti=setInterval(()=>{sfxTick();tc++;if(tc>=15)clearInterval(ti)},240-tc*7);
setTimeout(()=>{clearInterval(ti);bets={};updBV();doFinish(ln,savedBets,tb,isFS,btn)},4200);
}

function doFinish(ln,bc,tb,isFS,btn){
spinning=false;btn.disabled=false;btn.classList.remove('spinning');
rec.totalSpins++;
const col=gc(ln);
document.getElementById('wRes').style.visibility='visible';
const rc=document.getElementById('rCircle');
rc.textContent=ln;rc.className=`rc r${col[0]}`; // rr, rb, rg
let tw=0;const wd=[];
Object.entries(bc).forEach(([k,a])=>{
if(k.startsWith('n_')&&String(ln)===k.substring(2)){const w=a*36;tw+=w;wd.push(`#${k.substring(2)} 적중! +${fmt(w)}`)}
else if(k==='red'&&col==='red'){tw+=a*2;wd.push(`RED +${fmt(a*2)}`)}
else if(k==='black'&&col==='black'){tw+=a*2;wd.push(`BLACK +${fmt(a*2)}`)}
else if(k==='even'&&typeof ln==='number'&&ln>0&&ln%2===0){tw+=a*2;wd.push(`짝수 +${fmt(a*2)}`)}
else if(k==='odd'&&typeof ln==='number'&&ln>0&&ln%2===1){tw+=a*2;wd.push(`홀수 +${fmt(a*2)}`)}
else if(k==='low'&&typeof ln==='number'&&ln>=1&&ln<=18){tw+=a*2;wd.push(`1-18 +${fmt(a*2)}`)}
else if(k==='high'&&typeof ln==='number'&&ln>=19&&ln<=36){tw+=a*2;wd.push(`19-36 +${fmt(a*2)}`)}
});
const isW=tw>0,pr=tw-tb;
chips+=tw;
if(isW){streak++}else{streak=0}
if(streak>rec.maxStreak){rec.maxStreak=streak;sv('rl_r',rec)}
if(pr>rec.biggestWin){rec.biggestWin=pr;sv('rl_r',rec)}
updUI();
hist.unshift({num:ln,col,bet:tb,win:tw,pr,isW,streak,isFS,ts:Date.now()});
if(hist.length>50)hist.length=50;
sv('rl_h',hist);
// Bonuses
let be=0,bm=[];
if(isW&&streak>0&&streak%3===0){const sb=Math.floor(tb*0.5);be+=sb;bm.push({t:`🔥 ${streak}연승!`,s:`보너스 +${fmt(sb)}`})}
if(ln===7){be+=10000;bm.push({t:'🎰 LUCKY 7!',s:'+10,000 보너스'})}
if(tb>=chips-tw+tb-500&&isW){const ab=Math.floor(tb*0.2);be+=ab;bm.push({t:'💎 ALL-IN WIN!',s:`+${fmt(ab)} 챌린지`})}
if(Math.random()<0.05&&!isFS){freeSpins++;bm.push({t:'⭐ FREE SPIN!',s:'무료 회전권 획득!'})}
if(be>0){chips+=be;updUI()}
bm.forEach((b,i)=>setTimeout(()=>{showBP(b.t,b.s);sfxBonus()},300+i*1500));
const cname=col==='red'?'빨강':col==='black'?'검정':'그린';
const ni=`<span class="rc r${col[0]}" style="width:20px;height:20px;font-size:11px;display:inline-flex;vertical-align:middle">${ln}</span>`;
const big=pr>=tb*10;
if(isW){sfxWin();if(big){sfxJP();mkCoins(12)}
showToast(big?'jackpot':'win',big?'🎰 BIG WIN! 🎰':'🎉 WIN!',`결과: ${ni} (${cname})`,`+${fmt(tw)}`,wd.join(' · '));
mkConf(30+Math.min(pr/tb,8)*5);mkSparks(12);
if(big){const fl=document.createElement('div');fl.className='flash-ov';document.body.appendChild(fl);setTimeout(()=>fl.remove(),500)}
}else{sfxLose();showToast('lose','✕ LOSE ✕',`결과: ${ni} (${cname})`,`-${fmt(tb)}`,'');}
if(chips<100)setTimeout(()=>{if(confirm('💸 칩이 부족해요!\n초기화할까요?'))resetGame()},2000);
}

function showToast(type,h,d,a,w){
const t=document.getElementById('rTst');
document.getElementById('rtH').textContent=h;document.getElementById('rtH').className='rth '+type;
document.getElementById('rtD').innerHTML=d;document.getElementById('rtA').textContent=a;
document.getElementById('rtA').className='rta'+(type==='lose'?' lose':'');
document.getElementById('rtW').textContent=w;
t.classList.add('show');if(toastTmr)clearTimeout(toastTmr);toastTmr=setTimeout(closeToast,4000);
}
function closeToast(){document.getElementById('rTst').classList.remove('show');if(toastTmr){clearTimeout(toastTmr);toastTmr=null}}
function showBP(t,s){const p=document.createElement('div');p.className='bp';p.innerHTML=`${t}<span class="bps">${s}</span>`;document.body.appendChild(p);setTimeout(()=>p.remove(),2600)}

function resetGame(){if(!confirm('게임 초기화?\n(10만 칩으로 리셋 · 기록 유지)'))return;chips=100000;bets={};streak=0;freeSpins=0;totalSpins=0;updUI();updBV();closeToast();document.getElementById('wRes').style.visibility='hidden'}

function showTab(tab,el){sfxClick();document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));const m={game:'scGame',records:'scRecords',history:'scHistory'};document.getElementById(m[tab]).classList.add('active');el.classList.add('active');if(tab==='records')renRec();if(tab==='history')renHis()}

function renRec(){document.getElementById('recCont').innerHTML=`
<div class="recc"><div class="rect">💰 MAX CHIPS</div><div class="recv">${fmt(rec.maxChips)}</div><div class="recs">최고 소지금 기록</div></div>
<div class="recc"><div class="rect">🏆 BIGGEST WIN</div><div class="recv">+${fmt(rec.biggestWin)}</div><div class="recs">한 번에 가장 많이 딴 금액</div></div>
<div class="recg">
<div class="recc"><div class="rect">🔥 BEST STREAK</div><div class="recv">${rec.maxStreak}연승</div></div>
<div class="recc"><div class="rect">🎡 TOTAL SPINS</div><div class="recv">${fmt(rec.totalSpins)}</div></div>
</div>
<div class="sh">▼ CURRENT ▼</div>
<div class="recg">
<div class="recc"><div class="rect">CHIPS</div><div class="recv">${fmt(chips)}</div></div>
<div class="recc"><div class="rect">STREAK</div><div class="recv">${streak}연승</div></div>
</div>`}

function renHis(){const c=document.getElementById('hisCont');if(!hist.length){c.innerHTML='<div class="est">📭 아직 기록 없어요!</div>';return}
let h='<div class="ht">';hist.forEach(e=>{h+=`<div class="hr ${e.isW?'win':'lose'}"><div class="hn ${e.col}">${e.num}</div><div class="hd">${e.isFS?'🎁 ':''}베팅: ${fmt(e.bet)}${e.streak>0?`<br><span style="font-size:9px;color:var(--neon-green)">${e.streak}연승</span>`:''}</div><div class="ha ${e.isW?'win':'lose'}">${e.isW?'+':'-'}${fmt(e.isW?e.win:e.bet)}</div></div>`});c.innerHTML=h+'</div>'}

function mkConf(n){const cols=['#FFD700','#FF1493','#00FFFF','#39FF14','#BF00FF','#FF0000','#FFA500'];for(let i=0;i<n;i++){const e=document.createElement('div');e.className='confetti';const sz=Math.random()*7+3;e.style.cssText=`left:${Math.random()*100}%;width:${sz}px;height:${sz*1.5}px;background:${cols[i%cols.length]};animation-duration:${Math.random()*2+1.5}s;animation-delay:${Math.random()*0.4}s`;document.body.appendChild(e);setTimeout(()=>e.remove(),4000)}}
function mkSparks(n){const cx=window.innerWidth/2,cy=window.innerHeight/2;for(let i=0;i<n;i++){const e=document.createElement('div');e.className='spark';const a=Math.random()*Math.PI*2,d=Math.random()*150+80;e.style.left=cx+'px';e.style.top=cy+'px';e.style.setProperty('--dx',Math.cos(a)*d+'px');e.style.setProperty('--dy',Math.sin(a)*d+'px');document.body.appendChild(e);setTimeout(()=>e.remove(),1300)}}
function mkCoins(n){for(let i=0;i<n;i++){const e=document.createElement('div');e.className='coin-fx';e.textContent='🪙';e.style.cssText=`left:${Math.random()*100}%;font-size:${Math.random()*14+16}px;animation-duration:${Math.random()*1.5+1.5}s;animation-delay:${Math.random()*1.2}s`;document.body.appendChild(e);setTimeout(()=>e.remove(),5000)}}

if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
updUI();
</script>
</body>
