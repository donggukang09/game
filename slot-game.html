<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--gold:#FFD700;--gold2:#FFA500;--gold-dark:#8B6914;--gold-deep:#5C4A0F;
--red:#E60012;--red-deep:#8B0000;--red-dark:#4A0000;
--cream:#FFF8DC;--ivory:#FFFAF0;
--neon-pink:#FF10F0;--neon-cyan:#00FFFF;--neon-green:#39FF14;--neon-purple:#BF00FF;--neon-orange:#FF6B00;
--metal-light:#D4AF37;--metal-mid:#996515;--metal-dark:#3D2807;
--velvet:#1a0511;--bg:#0a0508;
--pixel:'Press Start 2P','Courier New',monospace;
--retro:'VT323','Courier New',monospace;
--display:'Bungee',Impact,sans-serif;
--display-shade:'Bungee Shade',Impact,sans-serif;
--korean-bold:'Black Han Sans','Jua','Malgun Gothic',sans-serif;
--korean:'Jua','Malgun Gothic','맑은 고딕',sans-serif;
}
html,body{height:100%;overflow:hidden;-webkit-text-size-adjust:100%;background:#000}
body{
font-family:var(--korean);
color:var(--cream);
display:flex;justify-content:center;align-items:center;
background:radial-gradient(ellipse at center,#1a0511 0%,#000 100%);
overscroll-behavior:none;
}

#app{
width:100%;max-width:480px;height:100vh;height:100dvh;
position:relative;overflow:hidden;
background:
radial-gradient(ellipse at top,#2a0820 0%,transparent 50%),
radial-gradient(ellipse at bottom,#3d1a0a 0%,transparent 60%),
linear-gradient(180deg,#0d0205 0%,#1a0511 50%,#0d0205 100%);
}

#app::before{
content:'';position:absolute;inset:0;pointer-events:none;z-index:0;opacity:.06;
background-image:
repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(255,255,255,.5) 2px,rgba(255,255,255,.5) 3px),
repeating-linear-gradient(90deg,transparent,transparent 2px,rgba(255,255,255,.3) 2px,rgba(255,255,255,.3) 3px);
mix-blend-mode:overlay;
}

/* SCREENS */
.screen{
position:absolute;inset:0;
display:flex;flex-direction:column;align-items:center;
transition:transform .5s cubic-bezier(.7,0,.3,1),opacity .4s;
overflow-y:auto;overflow-x:hidden;
-webkit-overflow-scrolling:touch;
z-index:5;
padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
}
.screen.hidden{transform:translateX(110%);opacity:0;pointer-events:none}
.screen.exit-left{transform:translateX(-110%);opacity:0;pointer-events:none}

/* MARQUEE */
.marquee{
position:fixed;top:0;left:50%;transform:translateX(-50%);
width:100%;max-width:480px;height:100vh;height:100dvh;
pointer-events:none;z-index:1;
}
.bulb{
position:absolute;width:8px;height:8px;border-radius:50%;
background:radial-gradient(circle at 30% 30%,#fff,var(--gold) 40%,var(--gold-dark) 90%);
box-shadow:0 0 6px var(--gold),0 0 10px rgba(255,215,0,.5);
transition:all .12s;
}
.bulb.off{
background:radial-gradient(circle at 30% 30%,#3d2807,#1a0f00);
box-shadow:none;
}

/* MAIN MENU */
.scMain{padding:24px 18px}
.logo-wrap{margin-top:30px;text-align:center;z-index:3;display:flex;flex-direction:column;align-items:center}
.logo-frame{
position:relative;padding:16px 28px;
border:3px solid var(--gold);border-radius:14px;
background:repeating-linear-gradient(45deg,#2a0820,#2a0820 4px,#1a0511 4px,#1a0511 8px);
box-shadow:0 0 0 2px var(--red),0 0 20px rgba(255,215,0,.4),inset 0 0 15px rgba(0,0,0,.6);
}
.logo-frame::before,.logo-frame::after{
content:'★';position:absolute;font-size:18px;color:var(--gold);
text-shadow:0 0 10px var(--gold);
}
.logo-frame::before{top:-13px;left:50%;transform:translateX(-50%);background:#0a0508;padding:0 6px}
.logo-frame::after{bottom:-13px;left:50%;transform:translateX(-50%);background:#0a0508;padding:0 6px}
.logo-line1{font-family:var(--display-shade);font-size:32px;letter-spacing:3px;color:var(--gold);text-shadow:0 0 10px rgba(255,215,0,.6);line-height:1}
.logo-line2{
font-family:var(--display);font-size:42px;letter-spacing:6px;color:var(--red);
text-shadow:2px 2px 0 var(--gold),4px 4px 0 var(--red-deep),0 0 15px rgba(230,0,18,.6);
line-height:.95;margin-top:4px;
}
.logo-line3{font-family:var(--pixel);font-size:9px;letter-spacing:4px;color:var(--neon-cyan);text-shadow:0 0 8px var(--neon-cyan);margin-top:10px}
.logo-7s{display:flex;gap:12px;margin-top:14px;justify-content:center}
.lucky7{
font-family:var(--display);font-size:50px;color:var(--red);
text-shadow:-1px -1px 0 var(--gold),1px -1px 0 var(--gold),-1px 1px 0 var(--gold),1px 1px 0 var(--gold),0 0 20px rgba(255,215,0,.8);
animation:luckyPulse 1.5s ease-in-out infinite alternate;line-height:1;
}
.lucky7:nth-child(2){animation-delay:.5s}.lucky7:nth-child(3){animation-delay:1s}
@keyframes luckyPulse{0%{transform:scale(1) rotate(-2deg);filter:brightness(1)}100%{transform:scale(1.1) rotate(2deg);filter:brightness(1.4)}}

.menu-list{display:flex;flex-direction:column;gap:14px;width:100%;padding:30px 0 24px;z-index:3}
.menu-card{
position:relative;cursor:pointer;
background:linear-gradient(135deg,#2a0820 0%,#1a0511 50%,#2a0820 100%);
border:2px solid var(--gold-dark);border-radius:12px;padding:0;overflow:hidden;
box-shadow:inset 0 1px 0 rgba(255,215,0,.2),0 4px 0 var(--red-dark),0 6px 12px rgba(0,0,0,.6);
transition:all .15s;-webkit-tap-highlight-color:transparent;
}
.menu-card:active{transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,215,0,.2),0 1px 0 var(--red-dark),0 2px 4px rgba(0,0,0,.6)}
.menu-card-inner{display:flex;align-items:center;gap:14px;padding:14px 16px;border-top:1px solid rgba(255,215,0,.3);border-bottom:1px solid rgba(255,215,0,.15)}
.mc-icon-box{
width:46px;height:46px;border-radius:8px;flex-shrink:0;
background:radial-gradient(circle at 30% 30%,var(--gold) 0%,var(--gold-dark) 70%,var(--gold-deep) 100%);
display:flex;align-items:center;justify-content:center;font-size:24px;
box-shadow:inset 0 0 8px rgba(0,0,0,.4),0 2px 4px rgba(0,0,0,.4);border:2px solid var(--gold);
}
.mc-body{flex:1}
.mc-title{font-family:var(--display);font-size:16px;letter-spacing:1.5px;color:var(--gold);text-shadow:1px 1px 0 var(--red-dark);line-height:1.1}
.mc-desc{font-family:var(--korean);font-size:12px;color:rgba(255,248,220,.65);margin-top:3px}
.mc-arrow{font-family:var(--display);color:var(--red);font-size:20px;text-shadow:0 0 8px rgba(230,0,18,.6)}

.footer-tag{margin-top:auto;padding:14px 0 16px;text-align:center;font-family:var(--pixel);font-size:7px;letter-spacing:3px;color:rgba(255,215,0,.4);z-index:3}

/* INSTALL BANNER */
.install-banner{
position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
width:90%;max-width:420px;
background:linear-gradient(135deg,var(--gold) 0%,var(--gold2) 100%);
color:var(--red-deep);padding:12px 16px;border-radius:14px;
display:none;align-items:center;gap:12px;z-index:300;
box-shadow:0 8px 30px rgba(255,215,0,.5);
font-family:var(--korean-bold);font-size:13px;
border:2px solid var(--red-deep);
animation:slideUp .4s ease-out;
}
.install-banner.show{display:flex}
@keyframes slideUp{from{transform:translate(-50%,100px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.install-banner button{
margin-left:auto;background:var(--red-deep);color:var(--gold);
border:none;padding:8px 14px;border-radius:8px;
font-family:var(--display);font-size:13px;cursor:pointer;letter-spacing:1px;
}
.install-banner .close-x{
background:none;color:var(--red-deep);padding:4px 8px;font-size:18px;
margin-left:0;
}

/* INPUT */
.scInput{padding:16px 20px}
.back-btn{background:none;border:2px solid var(--gold-dark);color:var(--gold);font-family:var(--pixel);font-size:8px;cursor:pointer;z-index:3;align-self:flex-start;margin-top:8px;padding:7px 12px;border-radius:6px;letter-spacing:1.5px}
.back-btn:active{background:rgba(255,215,0,.1)}
.input-title{font-family:var(--display-shade);font-size:28px;letter-spacing:2px;color:var(--gold);text-align:center;margin:18px 0 4px;z-index:3;text-shadow:2px 2px 0 var(--red-dark),0 0 12px rgba(255,215,0,.4)}
.input-sub{font-family:var(--pixel);font-size:8px;letter-spacing:1.5px;color:rgba(255,16,240,.7);text-align:center;margin-bottom:18px;z-index:3;text-shadow:0 0 6px rgba(255,16,240,.5)}
.chips{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;min-height:6px;z-index:3;margin-bottom:14px;width:100%}
.chip{
position:relative;background:linear-gradient(180deg,var(--gold) 0%,var(--gold-dark) 100%);
color:#1a0511;border-radius:50px;padding:7px 12px;font-size:14px;font-weight:700;
font-family:var(--korean);
display:inline-flex;align-items:center;gap:7px;
box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 2px 4px rgba(0,0,0,.5);
animation:chipIn .25s ease-out;border:1.5px solid var(--gold-deep);
}
@keyframes chipIn{from{transform:scale(0) rotate(-180deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
.chip-x{cursor:pointer;color:var(--red-deep);font-weight:900;font-size:14px;width:18px;height:18px;display:flex;align-items:center;justify-content:center;background:var(--ivory);border-radius:50%;line-height:1}
.input-row{display:flex;gap:8px;z-index:3;width:100%;margin-bottom:14px}
.txt-in{flex:1;background:linear-gradient(180deg,#1a0511,#2a0820);border:2px solid var(--gold-dark);border-radius:10px;padding:12px 14px;color:var(--ivory);font-size:15px;outline:none;font-family:var(--korean);font-weight:600;box-shadow:inset 0 2px 4px rgba(0,0,0,.5)}
.txt-in:focus{border-color:var(--gold);box-shadow:inset 0 2px 4px rgba(0,0,0,.5),0 0 10px rgba(255,215,0,.3)}
.txt-in::placeholder{color:rgba(255,248,220,.25)}
.add-btn{background:linear-gradient(180deg,var(--gold) 0%,var(--gold2) 50%,var(--gold-dark) 100%);border:2px solid var(--gold-deep);border-radius:10px;padding:12px 18px;color:var(--red-deep);font-family:var(--display);font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap;letter-spacing:1px;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 3px 0 var(--gold-deep)}
.add-btn:active{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 1px 0 var(--gold-deep)}
.ps{z-index:3;width:100%;margin-bottom:16px}
.ps-label{font-family:var(--pixel);font-size:7px;letter-spacing:2px;color:var(--neon-cyan);margin-bottom:8px;text-shadow:0 0 5px rgba(0,255,255,.4)}
.ps-chips{display:flex;flex-wrap:wrap;gap:5px}
.ps-chip{background:rgba(255,215,0,.06);border:1.5px dashed rgba(255,215,0,.3);border-radius:50px;padding:5px 10px;font-size:13px;color:rgba(255,248,220,.7);cursor:pointer;font-weight:600;font-family:var(--korean)}
.ps-chip:active{background:rgba(255,215,0,.18);color:var(--gold);border-style:solid}
.go-btn{position:relative;width:100%;padding:0;border:none;border-radius:14px;background:linear-gradient(180deg,#FF1F1F 0%,var(--red) 50%,var(--red-deep) 100%);color:var(--gold);font-family:var(--display);font-size:22px;letter-spacing:2.5px;cursor:pointer;box-shadow:inset 0 2px 0 rgba(255,255,255,.3),inset 0 -3px 0 var(--red-dark),0 5px 0 var(--red-dark),0 8px 20px rgba(230,0,18,.5);transition:all .12s;z-index:3;margin:auto 0 14px;overflow:hidden}
.go-btn-inner{display:block;padding:18px 14px;border:2px solid var(--gold);border-radius:11px;margin:3px;text-shadow:1px 1px 0 var(--red-dark),0 0 10px rgba(255,215,0,.5)}
.go-btn:disabled{opacity:.4;cursor:not-allowed}
.go-btn:not(:disabled):active{transform:translateY(4px);box-shadow:inset 0 2px 0 rgba(255,255,255,.3),inset 0 -3px 0 var(--red-dark),0 1px 0 var(--red-dark)}

/* ============= SLOT MACHINE ============= */
.scSlot{
padding:8px 12px;
justify-content:center; /* CENTER VERTICALLY */
align-items:center;
background:radial-gradient(ellipse at 50% 40%,rgba(230,0,18,.18) 0%,transparent 60%),radial-gradient(ellipse at center,#2a0820 0%,#0a0508 70%);
}
.slot-top-btn{
position:absolute;top:14px;left:14px;z-index:6;
background:rgba(0,0,0,.4);border:2px solid var(--gold-dark);color:var(--gold);
font-family:var(--pixel);font-size:7px;
padding:6px 10px;border-radius:6px;letter-spacing:1.5px;cursor:pointer;
}

/* MACHINE CONTAINER - centered vertically */
.machine-stage{
display:flex;flex-direction:column;align-items:center;justify-content:center;
width:100%;max-width:380px;
position:relative;z-index:3;
flex:0 0 auto;
}

.machine{position:relative;width:100%;}

/* CROWN */
.crown{
position:relative;margin:0 auto;width:88%;
background:linear-gradient(180deg,#FF1F1F,var(--red) 50%,var(--red-deep));
border:3px solid var(--gold);border-radius:80px 80px 8px 8px;
padding:10px 16px 12px;text-align:center;
box-shadow:inset 0 2px 0 rgba(255,255,255,.3),inset 0 -3px 0 var(--red-dark),0 4px 12px rgba(0,0,0,.6);
margin-bottom:-8px;
}
.crown-stars{display:flex;justify-content:center;gap:8px;margin-bottom:4px}
.crown-star{font-size:11px;color:var(--gold);text-shadow:0 0 6px var(--gold);animation:starTwinkle 1.2s ease-in-out infinite}
.crown-star:nth-child(2){animation-delay:.3s}.crown-star:nth-child(3){animation-delay:.6s}.crown-star:nth-child(4){animation-delay:.9s}.crown-star:nth-child(5){animation-delay:1.2s}
@keyframes starTwinkle{0%,100%{opacity:.3;transform:scale(.7)}50%{opacity:1;transform:scale(1.2)}}
.crown-title{font-family:var(--display-shade);font-size:18px;letter-spacing:2px;color:var(--gold);text-shadow:1px 1px 0 var(--red-dark),0 0 8px rgba(255,215,0,.6);line-height:1}
.crown-sub{font-family:var(--pixel);font-size:7px;letter-spacing:2px;color:var(--ivory);margin-top:5px}

/* BODY */
.body-frame{
position:relative;
background:linear-gradient(180deg,#FFD700 0%,#FFA500 30%,#B8860B 60%,#8B6914 100%);
border:3px solid var(--gold-deep);border-radius:18px;
padding:20px 16px 14px;
box-shadow:inset 0 2px 0 rgba(255,255,255,.5),inset 0 -4px 0 rgba(0,0,0,.3),inset 4px 0 8px rgba(0,0,0,.2),inset -4px 0 8px rgba(0,0,0,.2),0 8px 20px rgba(0,0,0,.7);
}
.bolt{position:absolute;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,var(--gold-dark) 50%,#000 100%);box-shadow:inset 0 0 2px rgba(0,0,0,.5)}
.bolt::after{content:'';position:absolute;inset:3px;border-radius:50%;background:linear-gradient(45deg,transparent 45%,rgba(0,0,0,.6) 45%,rgba(0,0,0,.6) 55%,transparent 55%)}
.bolt.tl{top:6px;left:6px}.bolt.tr{top:6px;right:6px}.bolt.bl{bottom:6px;left:6px}.bolt.br{bottom:6px;right:6px}

.side-bulbs{position:absolute;top:30px;bottom:80px;width:14px;display:flex;flex-direction:column;justify-content:space-around}
.side-bulbs.left{left:-2px}.side-bulbs.right{right:-2px}
.sb{width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff 0%,#FFD700 30%,#B8860B 70%,#5C4A0F 100%);box-shadow:0 0 6px var(--gold),0 0 10px rgba(255,215,0,.6)}
.sb.off{background:radial-gradient(circle at 30% 30%,#5C4A0F,#1a0f00);box-shadow:none}

/* DISPLAY PANEL */
.display-panel{
background:linear-gradient(180deg,#0a0a0a 0%,#1a0a0a 50%,#0a0a0a 100%);
border:3px solid var(--gold-deep);border-radius:8px;
padding:8px 10px;margin-bottom:10px;
box-shadow:inset 0 0 12px rgba(0,0,0,.9),inset 0 2px 4px rgba(0,0,0,.8);
display:flex;justify-content:space-between;align-items:center;
}
.display-cell{background:#000;border:1px solid var(--gold-dark);border-radius:4px;padding:4px 8px;flex:1}
.display-cell + .display-cell{margin-left:6px}
.display-label{font-family:var(--pixel);font-size:5px;letter-spacing:1px;color:var(--neon-cyan);opacity:.7}
.display-value{font-family:var(--retro);font-size:18px;font-weight:700;color:var(--neon-pink);text-shadow:0 0 6px var(--neon-pink);line-height:1;letter-spacing:1px}
.display-value.gold{color:var(--gold);text-shadow:0 0 6px var(--gold)}
.display-value.green{color:var(--neon-green);text-shadow:0 0 6px var(--neon-green)}
.display-value.red{color:var(--red);text-shadow:0 0 8px var(--red);animation:redBlink .3s infinite alternate}
@keyframes redBlink{0%{filter:brightness(1)}100%{filter:brightness(1.5)}}

/* REELS */
.reels-frame{
position:relative;
background:linear-gradient(180deg,#1a0a0a,#0a0505);
border:4px solid var(--gold-deep);border-radius:10px;
padding:6px;margin-bottom:12px;
box-shadow:inset 0 0 20px rgba(0,0,0,.95),inset 0 4px 8px rgba(0,0,0,.9),0 2px 4px rgba(255,215,0,.2);
}
.reels-box{display:flex;gap:5px;justify-content:center;background:#000;border-radius:6px;padding:6px 4px;border:2px inset #2a1a0a;position:relative}
.reel{flex:1;height:110px;overflow:hidden;position:relative;border-radius:4px;background:linear-gradient(180deg,#fff 0%,#f5f5f5 50%,#fff 100%);box-shadow:inset 0 0 8px rgba(0,0,0,.3)}
.reel::before{content:'';position:absolute;top:0;left:0;right:0;height:30px;z-index:2;background:linear-gradient(180deg,rgba(0,0,0,.7) 0%,transparent 100%);pointer-events:none}
.reel::after{content:'';position:absolute;bottom:0;left:0;right:0;height:30px;z-index:2;background:linear-gradient(0deg,rgba(0,0,0,.7) 0%,transparent 100%);pointer-events:none}
.reel-strip{display:flex;flex-direction:column;will-change:transform}
/* Clean readable font for menu items */
.reel-item{
height:110px;display:flex;align-items:center;justify-content:center;
font-family:'Jua','Malgun Gothic','맑은 고딕',sans-serif;
font-size:22px;font-weight:400;
color:#1a0511;text-align:center;
padding:6px;line-height:1.15;word-break:keep-all;
border-bottom:1px dashed rgba(0,0,0,.08);
letter-spacing:0;
}

.reel.win{animation:reelWin .4s ease-in-out infinite alternate}
@keyframes reelWin{0%{box-shadow:inset 0 0 8px rgba(0,0,0,.3),0 0 20px var(--gold)}100%{box-shadow:inset 0 0 8px rgba(0,0,0,.3),0 0 35px var(--neon-pink),0 0 50px var(--gold)}}

.payline{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);height:3px;background:transparent;z-index:3;pointer-events:none}
.payline.show-win{background:linear-gradient(90deg,transparent,var(--gold) 20%,var(--neon-pink) 50%,var(--gold) 80%,transparent);box-shadow:0 0 12px var(--gold)}

/* ============= LEVER (TOP-DOWN) ============= */
/* Lever container on the right side, vertical orientation */
.lever-tower{
position:absolute;
right:-44px;
top:50%;
transform:translateY(-50%);
width:64px;height:200px;
z-index:4;cursor:pointer;
-webkit-tap-highlight-color:transparent;
}
/* The metal track/groove that lever slides in */
.lever-track{
position:absolute;
left:50%;top:0;bottom:30px;
width:14px;
transform:translateX(-50%);
background:linear-gradient(90deg,#3D2807 0%,#666 30%,#999 50%,#666 70%,#3D2807 100%);
border-radius:7px;
box-shadow:inset 0 0 4px rgba(0,0,0,.8),inset 2px 0 2px rgba(0,0,0,.5);
}
/* Track inner shadow groove */
.lever-track::after{
content:'';position:absolute;left:50%;top:6px;bottom:6px;width:4px;
transform:translateX(-50%);
background:#1a0a0a;border-radius:2px;
box-shadow:inset 0 0 4px rgba(0,0,0,1);
}
/* Lever stick - vertical, slides up/down */
.lever-stick-v{
position:absolute;
left:50%;
top:0;
width:8px;height:60px;
background:linear-gradient(90deg,#5C4A0F 0%,#FFD700 30%,#FFA500 50%,#FFD700 70%,#5C4A0F 100%);
transform:translateX(-50%) translateY(0);
border-radius:4px;
box-shadow:1px 0 3px rgba(0,0,0,.6),inset 0 0 2px rgba(255,255,255,.3);
transition:transform .35s cubic-bezier(.5,1.6,.6,1);
z-index:2;
}
.lever-tower.pulled .lever-stick-v{
transform:translateX(-50%) translateY(110px);
}
/* Red ball on top */
.lever-ball-v{
position:absolute;
left:50%;
top:-12px;
width:32px;height:32px;border-radius:50%;
background:radial-gradient(circle at 30% 30%,#fff 0%,#FF4444 25%,var(--red) 50%,var(--red-deep) 80%,var(--red-dark) 100%);
transform:translateX(-50%) translateY(0);
box-shadow:inset -4px -4px 8px rgba(0,0,0,.5),inset 3px 3px 6px rgba(255,255,255,.3),0 3px 6px rgba(0,0,0,.6);
transition:transform .35s cubic-bezier(.5,1.6,.6,1);
z-index:3;
}
.lever-tower.pulled .lever-ball-v{
transform:translateX(-50%) translateY(110px);
}
/* Highlight on ball */
.lever-ball-v::before{
content:'';position:absolute;top:5px;left:8px;width:8px;height:6px;
background:rgba(255,255,255,.7);border-radius:50%;filter:blur(1px);
}
/* Base mount */
.lever-base-v{
position:absolute;left:50%;bottom:0;
width:36px;height:30px;
background:linear-gradient(180deg,#999 0%,#666 30%,#333 70%,#000 100%);
transform:translateX(-50%);
border-radius:6px 6px 4px 4px;
border:2px solid #222;
box-shadow:0 3px 8px rgba(0,0,0,.7),inset 0 2px 0 rgba(255,255,255,.2);
}
.lever-base-v::after{
content:'';position:absolute;top:4px;left:50%;width:22px;height:3px;
transform:translateX(-50%);background:#000;border-radius:2px;
}
.lever-label{
position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);
font-family:var(--pixel);font-size:6px;letter-spacing:1.5px;
color:var(--gold);text-shadow:0 0 4px var(--gold);
white-space:nowrap;
}

/* SPIN BUTTON */
.spin-btn-wrap{display:flex;justify-content:center;margin-top:8px}
.spin-btn{
position:relative;width:100%;padding:0;border:none;border-radius:14px;
background:linear-gradient(180deg,#FFD700 0%,#FFA500 50%,#8B6914 100%);
cursor:pointer;
box-shadow:inset 0 2px 0 rgba(255,255,255,.5),inset 0 -3px 0 var(--gold-deep),0 4px 0 var(--gold-deep),0 6px 14px rgba(0,0,0,.5);
transition:all .12s;overflow:hidden;
}
.spin-btn-inner{display:flex;align-items:center;justify-content:center;gap:10px;padding:14px 16px;font-family:var(--display);font-size:22px;letter-spacing:3px;color:var(--red-deep);text-shadow:1px 1px 0 rgba(255,215,0,.6),-1px -1px 0 rgba(255,255,255,.4);border:2px solid var(--red-deep);border-radius:11px;margin:3px}
.spin-btn:disabled{opacity:.5;cursor:not-allowed}
.spin-btn:not(:disabled):active{transform:translateY(3px);box-shadow:inset 0 2px 0 rgba(255,255,255,.5),inset 0 -3px 0 var(--gold-deep),0 1px 0 var(--gold-deep)}
.spin-btn.spinning{animation:spinPulse .4s infinite alternate}
@keyframes spinPulse{0%{box-shadow:inset 0 2px 0 rgba(255,255,255,.5),inset 0 -3px 0 var(--gold-deep),0 4px 0 var(--gold-deep),0 0 18px var(--gold)}100%{box-shadow:inset 0 2px 0 rgba(255,255,255,.5),inset 0 -3px 0 var(--gold-deep),0 4px 0 var(--gold-deep),0 0 35px var(--gold),0 0 60px var(--neon-pink)}}

.coin-tray{margin:10px auto 0;width:80%;background:linear-gradient(180deg,#3D2807 0%,#5C4A0F 50%,#3D2807 100%);border:2px solid var(--gold-deep);border-radius:0 0 16px 16px;border-top:none;height:18px;box-shadow:inset 0 -3px 6px rgba(0,0,0,.7),inset 0 2px 0 rgba(0,0,0,.5)}

/* ============= SPINNING EFFECTS ============= */
/* Vertical light streaks during spin */
.streak{
position:absolute;width:2px;height:100px;
background:linear-gradient(180deg,transparent,var(--gold),transparent);
opacity:0;pointer-events:none;
filter:blur(1px);
}
.streak.go{animation:streakFall .6s linear infinite}
@keyframes streakFall{0%{opacity:0;transform:translateY(-100%)}30%{opacity:1}100%{opacity:0;transform:translateY(200%)}}

/* Pulsing glow ring during spin */
.spin-ring{
position:absolute;inset:-20px;border-radius:20px;pointer-events:none;
border:3px solid transparent;opacity:0;
}
.spin-ring.active{
opacity:1;
animation:ringPulse 1s ease-in-out infinite;
border-image:linear-gradient(45deg,var(--gold),var(--neon-pink),var(--neon-cyan),var(--gold)) 1;
}
@keyframes ringPulse{0%,100%{box-shadow:0 0 20px var(--gold),0 0 40px var(--neon-pink),inset 0 0 20px rgba(255,16,240,.3)}50%{box-shadow:0 0 40px var(--neon-pink),0 0 80px var(--gold),inset 0 0 30px rgba(255,215,0,.4)}}

/* Spin background flashes */
.spin-flash{
position:fixed;inset:0;z-index:60;pointer-events:none;
background:radial-gradient(circle at 50% 50%,rgba(255,215,0,.15) 0%,transparent 70%);
opacity:0;
}
.spin-flash.active{animation:spinFlash 0.4s linear infinite}
@keyframes spinFlash{0%,100%{opacity:0}50%{opacity:1}}

/* Particle dots during spin */
.spin-particle{
position:fixed;z-index:55;pointer-events:none;
width:4px;height:4px;border-radius:50%;
animation:partFly 1.2s linear forwards;
}
@keyframes partFly{
0%{transform:translate(0,0) scale(0);opacity:0}
10%{opacity:1;transform:translate(0,0) scale(1)}
100%{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}
}

/* ============= RESULT ============= */
.result-area{margin-top:14px;text-align:center;z-index:3;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;flex-shrink:0}
.result-jackpot{font-family:var(--display-shade);font-size:42px;letter-spacing:3px;background:linear-gradient(180deg,#fff 0%,#FFD700 30%,#FFA500 60%,#FF0000 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 0 16px rgba(255,215,0,.9)) drop-shadow(0 0 30px rgba(255,16,240,.6));animation:jackpotShake .15s ease-in-out infinite;line-height:1}
@keyframes jackpotShake{0%{transform:translateX(-2px) rotate(-1deg) scale(1)}50%{transform:translateX(2px) rotate(1deg) scale(1.05)}100%{transform:translateX(-1px) rotate(-.5deg) scale(1)}}
.result-text{font-family:var(--korean-bold);font-size:30px;letter-spacing:1px;background:linear-gradient(180deg,#FFD700 0%,#FF8C00 50%,#FF0000 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 0 14px rgba(255,215,0,.7));animation:resPop .5s ease-out;margin-top:6px;line-height:1.1}
@keyframes resPop{from{transform:scale(0) rotate(-15deg);opacity:0}to{transform:scale(1);opacity:1}}
.result-sub{font-family:var(--korean);font-size:13px;color:var(--neon-cyan);margin-top:8px;text-shadow:0 0 6px rgba(0,255,255,.5);font-weight:700}
.result-miss{font-family:var(--display-shade);font-size:38px;letter-spacing:4px;color:#666;text-shadow:2px 2px 0 #000,0 0 12px rgba(255,0,0,.4);animation:missShake .3s ease-out}
@keyframes missShake{0%{transform:translateX(-10px)}25%{transform:translateX(10px)}50%{transform:translateX(-5px)}75%{transform:translateX(5px)}100%{transform:translateX(0)}}
.result-miss-sub{font-family:var(--korean);font-size:13px;color:#bbb;margin-top:6px;font-weight:700}
.result-near{font-family:var(--korean-bold);font-size:18px;color:var(--neon-cyan);margin-top:4px;letter-spacing:1px}

.btn-row{display:flex;gap:8px;margin-top:14px;z-index:3;width:100%;max-width:380px;flex-shrink:0}
.sec-btn{flex:1;padding:11px 4px;border:2px solid var(--gold-dark);border-radius:8px;background:linear-gradient(180deg,#2a0820,#1a0511);color:var(--gold);font-family:var(--pixel);font-size:8px;cursor:pointer;letter-spacing:1px}
.sec-btn:active{background:linear-gradient(180deg,#3a1230,#2a0820);border-color:var(--gold)}

/* CONFETTI / FX */
.confetti{position:fixed;z-index:200;pointer-events:none;animation:cf linear forwards}
@keyframes cf{0%{transform:translateY(-10vh) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
.coin-fx{position:fixed;z-index:199;pointer-events:none;font-size:24px;animation:cn linear forwards;will-change:transform}
@keyframes cn{0%{transform:translateY(-10vh) rotateY(0) scale(.5);opacity:0}10%{opacity:1;transform:translateY(0) rotateY(180deg) scale(1.2)}100%{transform:translateY(110vh) rotateY(1440deg) scale(1);opacity:0}}
.spark{position:fixed;z-index:198;pointer-events:none;width:4px;height:4px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold),0 0 16px var(--gold);animation:sparkFly 1.2s ease-out forwards}
@keyframes sparkFly{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.firework{position:fixed;z-index:197;pointer-events:none;width:6px;height:6px;border-radius:50%;animation:fwFly 1s ease-out forwards}
@keyframes fwFly{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
.flash-overlay{position:fixed;inset:0;background:#fff;z-index:300;pointer-events:none;opacity:0;animation:flashFx .4s ease-out}
@keyframes flashFx{0%{opacity:0}10%{opacity:.95}100%{opacity:0}}
.bg-pulse{position:fixed;inset:0;z-index:50;pointer-events:none;background:radial-gradient(circle at center,rgba(255,215,0,.3) 0%,rgba(255,16,240,.15) 30%,transparent 70%);animation:bgP 1s ease-out}
@keyframes bgP{0%{opacity:0;transform:scale(.5)}50%{opacity:1}100%{opacity:0;transform:scale(2)}}
.shake{animation:scShake .4s ease-in-out}
@keyframes scShake{0%,100%{transform:translate(0,0)}20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-3px,-2px)}80%{transform:translate(3px,2px)}}

/* small screens */
@media (max-height:700px){
.machine-stage{transform:scale(.92);transform-origin:center}
}
@media (max-height:620px){
.machine-stage{transform:scale(.85)}
}
</style>
</head>

<script>
// ====== PWA INSTALL ======
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{
e.preventDefault();
deferredPrompt=e;
const banner=document.getElementById('installBanner');
if(!localStorage.getItem('installDismissed'))banner.classList.add('show');
});
document.getElementById('installBtn').addEventListener('click',async()=>{
if(!deferredPrompt)return;
deferredPrompt.prompt();
const{outcome}=await deferredPrompt.userChoice;
deferredPrompt=null;
hideInstallBanner();
});
function hideInstallBanner(){
document.getElementById('installBanner').classList.remove('show');
localStorage.setItem('installDismissed','1');
}
// iOS install hint
if(/iPad|iPhone|iPod/.test(navigator.userAgent) && !window.navigator.standalone && !localStorage.getItem('installDismissed')){
setTimeout(()=>{
const banner=document.getElementById('installBanner');
banner.querySelector('span').textContent='📱 공유 → "홈 화면에 추가"';
banner.querySelector('button').style.display='none';
banner.classList.add('show');
},2000);
}

// ====== AUDIO ======
const AC=window.AudioContext||window.webkitAudioContext;
let ax;
function ea(){if(!ax)ax=new AC();if(ax.state==='suspended')ax.resume()}
function snd(type,freq,dur,vol=0.07){
ea();const o=ax.createOscillator(),g=ax.createGain();
o.type=type;o.frequency.value=freq;
g.gain.setValueAtTime(vol,ax.currentTime);
g.gain.exponentialRampToValueAtTime(0.001,ax.currentTime+dur);
o.connect(g);g.connect(ax.destination);o.start();o.stop(ax.currentTime+dur);
}
function sfxTick(){snd('square',700+Math.random()*600,0.04,0.05)}
function sfxStop(){
ea();const o=ax.createOscillator(),g=ax.createGain();
o.type='triangle';o.frequency.setValueAtTime(800,ax.currentTime);
o.frequency.exponentialRampToValueAtTime(200,ax.currentTime+0.2);
const g2=ax.createGain();
g2.gain.setValueAtTime(0.15,ax.currentTime);g2.gain.exponentialRampToValueAtTime(0.001,ax.currentTime+0.2);
o.connect(g2);g2.connect(ax.destination);o.start();o.stop(ax.currentTime+0.2);
}
function sfxLever(){
ea();const o=ax.createOscillator(),g=ax.createGain();
o.type='sawtooth';
o.frequency.setValueAtTime(380,ax.currentTime);
o.frequency.exponentialRampToValueAtTime(60,ax.currentTime+0.35);
g.gain.setValueAtTime(0.1,ax.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ax.currentTime+0.35);
o.connect(g);g.connect(ax.destination);o.start();o.stop(ax.currentTime+0.35);
setTimeout(()=>snd('square',1500,0.03,0.08),50);
setTimeout(()=>snd('square',800,0.05,0.1),350);
}

// SPINNING MUSIC
let spinInterval=null;
const spinMelody=[[523,660,784,1047,784,660,523,660],[440,554,659,880,659,554,440,554]];
let spinNoteIdx=0,melodyIdx=0;
function startSpinMusic(){
ea();spinNoteIdx=0;melodyIdx=0;
playSpinNote();spinInterval=setInterval(playSpinNote,140);
}
function playSpinNote(){
if(!ax)return;
const melody=spinMelody[melodyIdx];
const f=melody[spinNoteIdx%melody.length];
const o=ax.createOscillator(),g=ax.createGain();
o.type='square';o.frequency.value=f;
g.gain.setValueAtTime(0.04,ax.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ax.currentTime+0.13);
o.connect(g);g.connect(ax.destination);o.start();o.stop(ax.currentTime+0.13);
if(spinNoteIdx%2===0){
const o2=ax.createOscillator(),g2=ax.createGain();
o2.type='triangle';o2.frequency.value=f/4;
g2.gain.setValueAtTime(0.05,ax.currentTime);g2.gain.exponentialRampToValueAtTime(0.001,ax.currentTime+0.12);
o2.connect(g2);g2.connect(ax.destination);o2.start();o2.stop(ax.currentTime+0.12);
}
spinNoteIdx++;
if(spinNoteIdx%8===0)melodyIdx=(melodyIdx+1)%spinMelody.length;
}
function stopSpinMusic(){if(spinInterval){clearInterval(spinInterval);spinInterval=null}}

function sfxJackpot(){
ea();
const melody=[{f:523,d:.15},{f:659,d:.15},{f:784,d:.15},{f:1047,d:.3},{f:784,d:.15},{f:1047,d:.3},{f:659,d:.15},{f:784,d:.15},{f:1047,d:.15},{f:1319,d:.3},{f:1047,d:.15},{f:1319,d:.5}];
let t=ax.currentTime;
melody.forEach(n=>{
const o=ax.createOscillator(),g=ax.createGain();
o.type='square';o.frequency.value=n.f;
g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.13,t+0.02);g.gain.exponentialRampToValueAtTime(0.001,t+n.d);
o.connect(g);g.connect(ax.destination);o.start(t);o.stop(t+n.d);
const o2=ax.createOscillator(),g2=ax.createGain();
o2.type='triangle';o2.frequency.value=n.f*1.5;
g2.gain.setValueAtTime(0,t);g2.gain.linearRampToValueAtTime(0.07,t+0.02);g2.gain.exponentialRampToValueAtTime(0.001,t+n.d);
o2.connect(g2);g2.connect(ax.destination);o2.start(t);o2.stop(t+n.d);
const o3=ax.createOscillator(),g3=ax.createGain();
o3.type='sawtooth';o3.frequency.value=n.f/4;
g3.gain.setValueAtTime(0,t);g3.gain.linearRampToValueAtTime(0.06,t+0.02);g3.gain.exponentialRampToValueAtTime(0.001,t+n.d);
o3.connect(g3);g3.connect(ax.destination);o3.start(t);o3.stop(t+n.d);
t+=n.d;
});
}
function sfxCoinCascade(){
ea();
for(let i=0;i<25;i++){
const t=ax.currentTime+i*0.05;
const o=ax.createOscillator(),g=ax.createGain();
o.type='sine';
o.frequency.setValueAtTime(2000+Math.random()*3000,t);o.frequency.exponentialRampToValueAtTime(400+Math.random()*500,t+0.12);
g.gain.setValueAtTime(0.06,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.12);
o.connect(g);g.connect(ax.destination);o.start(t);o.stop(t+0.12);
}
}
function sfxMiss(){
ea();
[440,392,349,294].forEach((f,i)=>{
const t=ax.currentTime+i*0.12;
const o=ax.createOscillator(),g=ax.createGain();
o.type='sawtooth';o.frequency.value=f;
g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.08,t+0.02);g.gain.exponentialRampToValueAtTime(0.001,t+0.3);
o.connect(g);g.connect(ax.destination);o.start(t);o.stop(t+0.3);
});
}
function sfxFirework(){
ea();const o=ax.createOscillator(),g=ax.createGain();
o.type='sawtooth';o.frequency.setValueAtTime(2000,ax.currentTime);o.frequency.exponentialRampToValueAtTime(100,ax.currentTime+0.3);
g.gain.setValueAtTime(0.08,ax.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ax.currentTime+0.3);
o.connect(g);g.connect(ax.destination);o.start();o.stop(ax.currentTime+0.3);
}

// ====== MARQUEE ======
(function(){
const m=document.getElementById('marquee');
function build(){
m.innerHTML='';
const W=Math.min(480,window.innerWidth),H=window.innerHeight;
const sp=18,pts=[];
for(let x=10;x<W-10;x+=sp)pts.push([x,4]);
for(let y=10;y<H-10;y+=sp)pts.push([W-6,y]);
for(let x=W-10;x>10;x-=sp)pts.push([x,H-8]);
for(let y=H-10;y>10;y-=sp)pts.push([4,y]);
pts.forEach(p=>{
const d=document.createElement('div');d.className='bulb';
d.style.left=p[0]+'px';d.style.top=p[1]+'px';m.appendChild(d);
});
}
build();
window.addEventListener('resize',build);
let fr=0;
setInterval(()=>{
m.querySelectorAll('.bulb').forEach((d,i)=>d.classList.toggle('off',(i+fr)%3!==0));
fr++;
},170);
})();

// SIDE BULBS
(function(){
['sbL','sbR'].forEach(id=>{
const c=document.getElementById(id);
for(let i=0;i<8;i++){const d=document.createElement('div');d.className='sb';c.appendChild(d)}
});
let fr=0;
setInterval(()=>{
document.querySelectorAll('.sb').forEach((d,i)=>d.classList.toggle('off',(i+fr)%2!==0));
fr++;
},250);
})();

// ====== STATE ======
let cg='',items=[],spinning=false,spinCount=0,credits=100;
const presets={
menu:['김치찌개','된장찌개','비빔밥','불고기','제육볶음','짜장면','짬뽕','탕수육','초밥','돈까스','파스타','피자','햄버거','떡볶이','칼국수','삼겹살','치킨','라멘','쌀국수','카레'],
category:['한식','중식','일식','양식','분식','동남아','멕시칸','인도','베트남','패스트푸드'],
person:[],
delivery:['🛵 배달','🏠 집밥','🍱 포장','🏪 편의점','🍳 밀키트']
};
const cfg={
menu:{t:'MENU',full:'MENU PICKER',s:'메뉴를 입력하세요 (최소 2개)',ph:'메뉴 이름...',min:2},
category:{t:'CATEGORY',full:'CATEGORY PICKER',s:'카테고리를 입력하세요 (최소 2개)',ph:'카테고리...',min:2},
person:{t:'PERSON',full:'WHO DECIDES?',s:'이름을 입력하세요 (최소 2개)',ph:'이름...',min:2},
delivery:{t:'CHOICE',full:'배달 vs 집밥',s:'선택지를 입력하세요 (최소 2개)',ph:'선택지...',min:2}
};

// NAV
function trans(f,t){
const fe=document.getElementById(f),te=document.getElementById(t);
fe.classList.add('exit-left');te.classList.remove('hidden','exit-left');te.scrollTop=0;
setTimeout(()=>{fe.classList.remove('exit-left');fe.classList.add('hidden')},500);
}
function openGame(t){
cg=t;items=[];spinCount=0;credits=100;
document.getElementById('inT').textContent=cfg[t].full;
document.getElementById('inS').textContent=cfg[t].s;
document.getElementById('inV').placeholder=cfg[t].ph;
render();trans('scMain','scInput');
setTimeout(()=>document.getElementById('inV').focus(),500);
}
function goBack(f){f==='input'?trans('scInput','scMain'):trans('scSlot','scInput')}
function goHome(){trans('scSlot','scMain')}

// INPUT
document.getElementById('inV').addEventListener('keydown',e=>{if(e.key==='Enter')addItem()});
function addItem(){const inp=document.getElementById('inV'),v=inp.value.trim();if(!v||items.includes(v))return;items.push(v);inp.value='';render()}
function removeItem(i){items.splice(i,1);render()}
function addPreset(v){if(!items.includes(v)){items.push(v);render()}}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/'/g,'&#39;').replace(/"/g,'&quot;')}
function render(){
document.getElementById('chips').innerHTML=items.map((it,i)=>`<div class="chip">${esc(it)}<span class="chip-x" onclick="removeItem(${i})">✕</span></div>`).join('');
const ps=presets[cg],sec=document.getElementById('psSec');
if(!ps||!ps.length){sec.style.display='none'}else{
sec.style.display='';
const avail=ps.filter(p=>!items.includes(p));
document.getElementById('psChips').innerHTML=avail.length?
avail.map(p=>`<span class="ps-chip" onclick="addPreset('${esc(p)}')">${esc(p)}</span>`).join('')
:'<span style="color:rgba(255,248,220,.3);font-size:11px">모두 추가됨!</span>';
}
document.getElementById('goBtn').disabled=items.length<cfg[cg].min;
}

// SLOT
const IH=110;
function goSlot(){
document.getElementById('slotT').textContent=cfg[cg].t+' PICKER';
document.getElementById('res').innerHTML='';
spinCount=0;credits=100;
updateDisplay('READY','green');
initReels();
trans('scInput','scSlot');
}
function initReels(){
for(let r=0;r<3;r++){
const st=document.getElementById('s'+r);st.innerHTML='';
const li=[];
for(let rep=0;rep<25;rep++)items.forEach(x=>li.push(x));
for(let i=li.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[li[i],li[j]]=[li[j],li[i]]}
li.forEach(x=>{const d=document.createElement('div');d.className='reel-item';d.textContent=x;st.appendChild(d)});
st.style.transform='translateY(0)';
document.getElementById('r'+r).classList.remove('win');
document.getElementById('pl'+r).classList.remove('show-win');
}
}
function updateDisplay(status,cls){
document.getElementById('dSpins').textContent=String(spinCount).padStart(3,'0');
document.getElementById('dCredits').textContent=credits;
const dst=document.getElementById('dStatus');
dst.textContent=status;dst.className='display-value '+(cls||'');
}

// ====== SPIN PARTICLES ======
let particleInterval=null;
function startSpinParticles(){
const cols=['#FFD700','#FF10F0','#00FFFF','#39FF14','#BF00FF','#FF6B00'];
particleInterval=setInterval(()=>{
const cx=window.innerWidth/2;
const cy=window.innerHeight/2;
for(let i=0;i<3;i++){
const e=document.createElement('div');
e.className='spin-particle';
const ang=Math.random()*Math.PI*2;
const d=Math.random()*150+60;
const c=cols[Math.floor(Math.random()*cols.length)];
e.style.left=cx+'px';e.style.top=cy+'px';
e.style.background=c;
e.style.boxShadow=`0 0 6px ${c},0 0 12px ${c}`;
e.style.setProperty('--dx',Math.cos(ang)*d+'px');
e.style.setProperty('--dy',Math.sin(ang)*d+'px');
document.body.appendChild(e);
setTimeout(()=>e.remove(),1300);
}
},120);
}
function stopSpinParticles(){if(particleInterval){clearInterval(particleInterval);particleInterval=null}}

// ====== PULL ======
function pull(){
if(spinning||items.length<2)return;
spinning=true;spinCount++;credits=Math.max(0,credits-1);
ea();sfxLever();

// Vertical lever animation
const lev=document.getElementById('lever');
lev.classList.add('pulled');
setTimeout(()=>lev.classList.remove('pulled'),700);

const btn=document.getElementById('pBtn');
btn.disabled=true;btn.classList.add('spinning');
document.getElementById('res').innerHTML='';
updateDisplay('SPIN..','red');

// SPINNING EFFECTS ON
document.getElementById('spinRing').classList.add('active');
document.getElementById('spinFlash').classList.add('active');
startSpinParticles();

// Determine result - reels independent unless forced
const reelResults=[
items[Math.floor(Math.random()*items.length)],
items[Math.floor(Math.random()*items.length)],
items[Math.floor(Math.random()*items.length)]
];
if(Math.random()<0.20){
const winner=items[Math.floor(Math.random()*items.length)];
reelResults[0]=reelResults[1]=reelResults[2]=winner;
}
const isJackpot=reelResults[0]===reelResults[1]&&reelResults[1]===reelResults[2];

startSpinMusic();

const durs=[1800,2600,3500];
let stopped=0;

for(let r=0;r<3;r++){
const strip=document.getElementById('s'+r);
const allItems=strip.querySelectorAll('.reel-item');
const target=reelResults[r];
const matching=[];
allItems.forEach((el,i)=>{if(el.textContent===target)matching.push(i)});
let tI=matching.length?matching[Math.floor(Math.random()*matching.length)]:Math.floor(allItems.length/2);
if(tI<8)tI+=items.length*4;
const tY=-(tI*IH);
const dur=durs[r];
let stTime=null,ltY=0;

function anim(ts){
if(!stTime)stTime=ts;
const p=Math.min((ts-stTime)/dur,1);
const e=1-Math.pow(1-p,3.5);
const total=tY-IH*items.length*4;
const cy=total*e;
strip.style.transform=`translateY(${cy}px)`;
if(Math.abs(cy-ltY)>IH){sfxTick();ltY=cy}
if(p<1){requestAnimationFrame(anim)}
else{
strip.style.transform=`translateY(${tY}px)`;
sfxStop();stopped++;
if(stopped===3){
stopSpinMusic();
stopSpinParticles();
document.getElementById('spinRing').classList.remove('active');
document.getElementById('spinFlash').classList.remove('active');
spinning=false;
btn.disabled=false;btn.classList.remove('spinning');
showResult(reelResults,isJackpot);
}
}
}
setTimeout(()=>requestAnimationFrame(anim),r*180);
}
}

// RESULT
function showResult(results,jackpot){
const a=document.getElementById('res');
const machine=document.getElementById('machine');
if(jackpot){
const winner=results[0];
credits+=100;
updateDisplay('JACKPOT','gold');
[0,1,2].forEach(i=>{document.getElementById('r'+i).classList.add('win');document.getElementById('pl'+i).classList.add('show-win')});
const flash=document.createElement('div');flash.className='flash-overlay';document.body.appendChild(flash);setTimeout(()=>flash.remove(),500);
const bgp=document.createElement('div');bgp.className='bg-pulse';document.body.appendChild(bgp);setTimeout(()=>bgp.remove(),1100);
machine.classList.add('shake');setTimeout(()=>machine.classList.remove('shake'),400);
sfxJackpot();setTimeout(sfxCoinCascade,300);
a.innerHTML=`<div class="result-jackpot">★ JACKPOT! ★</div><div class="result-text">${esc(winner)}</div><div class="result-sub">${cmtWin()}</div>`;
mkConfetti(120);mkCoins(30);mkSparks(40);
[300,600,900,1200].forEach(d=>setTimeout(()=>mkFireworks(),d));
}else{
updateDisplay('MISS!','red');
sfxMiss();
a.innerHTML=`<div class="result-miss">✕ MISS ✕</div><div class="result-near">${results.map(r=>esc(r)).join(' / ')}</div><div class="result-miss-sub">3개가 모두 같아야 결정! 다시 도전!</div>`;
machine.classList.add('shake');setTimeout(()=>machine.classList.remove('shake'),400);
}
}
function cmtWin(){
const c={menu:['오늘은 이거다! 🔥','맛있겠다~ 👨‍🍳','운명의 메뉴! ✨','이거 먹으러 가자! 🏃'],category:['이 장르로 결정! 🎯','오늘의 카테고리! 🏆','여기서 골라봐! 🍴'],person:['이 사람이 결정! 👑','오늘의 결정권자! 🎤','메뉴 정해주세요~ 🙏'],delivery:['결정됐다! 🎊','이걸로 가자! 💪','운명이 정했다! 🌟']};
const arr=c[cg]||c.menu;return arr[Math.floor(Math.random()*arr.length)];
}
function mkConfetti(n){
const cols=['#FFD700','#FF1493','#00FFFF','#39FF14','#BF00FF','#FF0000','#FFA500'];
for(let i=0;i<n;i++){
const e=document.createElement('div');e.className='confetti';const sz=Math.random()*8+4;
e.style.cssText=`left:${Math.random()*100}%;width:${sz}px;height:${sz*1.5}px;background:${cols[i%cols.length]};animation-duration:${Math.random()*2.5+2}s;animation-delay:${Math.random()*0.6}s`;
document.body.appendChild(e);setTimeout(()=>e.remove(),5000);
}
}
function mkCoins(n){
const emojis=['🪙','💰','💵','💎'];
for(let i=0;i<n;i++){
const e=document.createElement('div');e.className='coin-fx';e.textContent=emojis[Math.floor(Math.random()*emojis.length)];
e.style.cssText=`left:${Math.random()*100}%;font-size:${Math.random()*16+18}px;animation-duration:${Math.random()*1.5+1.5}s;animation-delay:${Math.random()*1.2}s`;
document.body.appendChild(e);setTimeout(()=>e.remove(),5000);
}
}
function mkSparks(n){
const cx=window.innerWidth/2,cy=window.innerHeight/2;
for(let i=0;i<n;i++){
const e=document.createElement('div');e.className='spark';
const ang=Math.random()*Math.PI*2;const dist=Math.random()*200+100;
e.style.left=cx+'px';e.style.top=cy+'px';
e.style.setProperty('--dx',Math.cos(ang)*dist+'px');e.style.setProperty('--dy',Math.sin(ang)*dist+'px');
document.body.appendChild(e);setTimeout(()=>e.remove(),1300);
}
}
function mkFireworks(){
sfxFirework();
const cols=['#FFD700','#FF1493','#00FFFF','#39FF14','#FF0000','#BF00FF'];
const cx=Math.random()*window.innerWidth;
const cy=Math.random()*(window.innerHeight*.5)+50;
const color=cols[Math.floor(Math.random()*cols.length)];
for(let i=0;i<24;i++){
const e=document.createElement('div');e.className='firework';
const ang=(Math.PI*2*i)/24;const dist=Math.random()*80+80;
e.style.cssText=`left:${cx}px;top:${cy}px;background:${color};box-shadow:0 0 8px ${color},0 0 16px ${color};--dx:${Math.cos(ang)*dist}px;--dy:${Math.sin(ang)*dist}px`;
document.body.appendChild(e);setTimeout(()=>e.remove(),1100);
}
}
updateDisplay('READY','green');
</script>
